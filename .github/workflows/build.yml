name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and install (Arch)
    runs-on: ubuntu-latest
    # The target is Arch/CachyOS, so build there. The package list below is the
    # one tools/install-user.sh probes for with pacman, so CI also proves that
    # list is complete - a Debian container needed a stubbed pacman and still
    # could not find a LayerShellQt CMake config, because Debian's
    # layer-shell-qt is an 8 KB metapackage with no headers in it.
    container: archlinux:base
    steps:
      - name: Install git and build dependencies
        run: |
          pacman -Sy --noconfirm --needed git
          # base-devel for the toolchain: archlinux:base has no compiler and no
          # make, so cmake configure dies with CMAKE_C_COMPILER not set.
          pacman -S --noconfirm --needed \
            base-devel cmake extra-cmake-modules \
            qt6-base qt6-declarative qt6-shadertools qt6-tools qt6-5compat \
            layer-shell-qt kwayland kwindowsystem

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and install into a throwaway prefix
        run: |
          chmod +x tools/install-user.sh
          PREFIX="$PWD/stage" BUILD_DIR="$PWD/build-ci" ./tools/install-user.sh

      - name: Verify the layout the dock expects at runtime
        run: |
          test -x stage/bin/cutefish-dock
          test -f stage/lib64/qt6/qml/FishUI/qmldir
          test -f stage/lib64/libcutefish-framework-appearance.so
          grep -q "^Exec=$PWD/stage/bin/cutefish-dock$" stage/share/applications/cutefish-dock.desktop
          grep -q 'X-KDE-Wayland-Interfaces=org_kde_plasma_window_management' \
               stage/share/applications/cutefish-dock.desktop
          # The FishUI plugin finds the appearance library through its RUNPATH,
          # so an unresolved dependency here means an empty dock at runtime.
          ! ldd stage/lib64/qt6/qml/FishUI/libFishUI.so | grep -q 'not found'
          echo "layout OK"

      - name: qmllint
        # Informational: the QML reaches its context objects through
        # setContextProperty, so qmllint reports unqualified access that cannot
        # be fixed without turning the objects into a typed QML module. Failures
        # here are a signal, not a gate.
        continue-on-error: true
        run: |
          qmllint=$(pacman -Ql qt6-declarative | grep -m1 '/bin/qmllint$' | cut -d' ' -f2-)
          "$qmllint" dock/qml/*.qml || true
